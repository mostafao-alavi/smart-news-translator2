name = "smart-news-translator2"
main = "src/index.ts"
compatibility_date = "2026-07-23"
compatibility_flags = ["nodejs_compat"]

[build]
command = "bun run build"

[observability]
enabled = true

[assets]
directory = "./dist"
not_found_handling = "single-page-application"

# Cloudflare Secrets Store (Centralized Encrypted Account Secrets)
# Mode 1: Full Store Binding (Recommended)
[[secrets_stores]]
binding = "MY_SEC_STORE"
store_id = "your-secrets-store-id"

# Mode 2: Individual Secrets Binding (Alternative)
# [[secrets_store_secrets]]
# binding = "TELEGRAM_BOT_TOKEN"
# store_id = "your-secrets-store-id"
# secret_name = "TELEGRAM_BOT_TOKEN"
#
# [[secrets_store_secrets]]
# binding = "WP_APPLICATION_PASSWORD"
# store_id = "your-secrets-store-id"
# secret_name = "WP_APPLICATION_PASSWORD"
#
# [[secrets_store_secrets]]
# binding = "GEMINI_API_KEY"
# store_id = "your-secrets-store-id"
# secret_name = "GEMINI_API_KEY"

# D1 Primary — اخبار، محتوا، تصاویر
[[d1_databases]]
binding = "DB"
database_name = "news_db"
database_id = "2815bd80-f483-4f9b-872d-93047309ed13"

# D1 Archive — ترجمه‌ها، توزیع‌ها، لاگ‌ها
[[d1_databases]]
binding = "DB_ARCHIVE"
database_name = "news_archive_db"
database_id = "efe58467-d7ce-4f36-ad57-592b694f8a0e"

# KV — کش RSS
[[kv_namespaces]]
binding = "CACHE"
id = "ea0caaac56ea4a5095af78a3667ef32c"

# Workers AI
[ai]
binding = "AI"

# Queues
[[queues.producers]]
binding = "SCRAPE_QUEUE"
queue = "news-scrape-queue"

[[queues.producers]]
binding = "TRANSLATE_QUEUE"
queue = "news-translate-queue"

[[queues.consumers]]
queue = "news-scrape-queue"
max_batch_size = 5
max_concurrency = 2

[[queues.consumers]]
queue = "news-translate-queue"
max_batch_size = 1
max_concurrency = 1

# Cron هر ۱۵ دقیقه
[triggers]
crons = ["*/15 * * * *"]

[vars]
WP_API_URL = "https://updaaate.ir/wp-json/wp/v2/"
WP_POST_STATUS = "publish"
WP_CATEGORY_ID = "3"
TELEGRAM_CHAT_ID = "@updaaate_crypto" # کانال تلگرام انتشار اخبار (کانال آپدیت)
TELEGRAM_ADMIN_ID = "" # شناسه عددی تلگرام شما (Admin ID)
